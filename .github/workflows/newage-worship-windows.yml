name: NEWAGE WORSHIP Windows Legacy Build

on:
  push:
    branches: [newage-worship-v1.0.0]
    paths:
      - '.newage-bootstrap/**'
      - '.newage-patch/**'
      - '.github/workflows/newage-worship-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win7-legacy:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4

      - name: Reconstruct verify and apply source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceNames = @(
            '.newage-bootstrap/source.b64.part00',
            '.newage-bootstrap/source.b64.part01',
            '.newage-bootstrap/source.b64.fix020',
            '.newage-bootstrap/source.b64.fix021',
            '.newage-bootstrap/source.b64.part03',
            '.newage-bootstrap/source.b64.part04',
            '.newage-bootstrap/source.b64.part05'
          )
          foreach ($name in $sourceNames) { if (-not (Test-Path $name)) { throw "Missing source chunk: $name" } }
          $sourceB64 = ($sourceNames | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $sourceZip = Join-Path $env:RUNNER_TEMP 'NW_CODE.zip'
          [IO.File]::WriteAllBytes($sourceZip, [Convert]::FromBase64String($sourceB64))
          $sourceHash = (Get-FileHash -Algorithm SHA256 $sourceZip).Hash.ToLowerInvariant()
          $sourceExpected = 'e4536533827c313e18da37f1b645ffe0532a95c5b6f1e77f77d98f86c03e8424'
          "source_bundle_sha256=$sourceHash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($sourceHash -ne $sourceExpected) { throw "Source bundle hash mismatch: $sourceHash" }
          Expand-Archive -Path $sourceZip -DestinationPath . -Force

          $patchNames = 0..6 | ForEach-Object { '.newage-patch/patch.b64.{0:D2}' -f $_ }
          foreach ($name in $patchNames) { if (-not (Test-Path $name)) { throw "Missing patch chunk: $name" } }
          $patchB64 = ($patchNames | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          $patchZip = Join-Path $env:RUNNER_TEMP 'NW_PATCH.zip'
          [IO.File]::WriteAllBytes($patchZip, [Convert]::FromBase64String($patchB64))
          $patchHash = (Get-FileHash -Algorithm SHA256 $patchZip).Hash.ToLowerInvariant()
          $patchExpected = '266ade556b26945d263aea04a27f75f43093dfee98bd36f7123fc43ffb0c9a6f'
          "patch_bundle_sha256=$patchHash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($patchHash -ne $patchExpected) { throw "Patch bundle hash mismatch: $patchHash" }
          Expand-Archive -Path $patchZip -DestinationPath 'NEWAGE_WORSHIP' -Force

          # The patch archive was generated before a duplicate WPF BorderBrush assignment was noticed.
          # Remove only the redundant nested assignment; the visible brush value remains unchanged.
          $studioXaml = 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/DesignStudioWindow.xaml'
          $studio = Get-Content $studioXaml -Raw
          $studio = $studio -replace '<Border.BorderBrush><SolidColorBrush Color="#66A9D1FF"/></Border.BorderBrush>',''
          Set-Content -Path $studioXaml -Value $studio -Encoding UTF8

          if (-not (Test-Path 'NEWAGE_WORSHIP/NewAgeWorship.sln')) { throw 'Solution missing after bootstrap extraction.' }
          New-Item -ItemType Directory -Force 'NEWAGE_WORSHIP/TEST_EVIDENCE' | Out-Null

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.12.1'

      - name: Restore .NET Framework dependencies
        shell: pwsh
        run: |
          msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /t:Restore /p:RestorePackagesConfig=true /v:minimal 2>&1 | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/restore.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Legacy WPF solution
        shell: pwsh
        run: |
          msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /m /p:Configuration=Release /p:Platform="Any CPU" /bl:'NEWAGE_WORSHIP/TEST_EVIDENCE/build.binlog' /v:minimal 2>&1 | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/build.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run foundation test harness
        shell: pwsh
        run: |
          $exe = 'NEWAGE_WORSHIP/tests/NewAgeWorship.FoundationTests/bin/Release/net48/NewAgeWorship.FoundationTests.exe'
          if (-not (Test-Path $exe)) { throw "Foundation test executable missing: $exe" }
          & $exe 2>&1 | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/foundation-tests.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Static secret and zero-cost policy checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allFiles = Get-ChildItem 'NEWAGE_WORSHIP' -Recurse -File -Include *.cs,*.xaml,*.json,*.md,*.yml,*.yaml,*.iss
          $secretPatterns = @('sk-[A-Za-z0-9]{20,}','AIza[0-9A-Za-z_-]{30,}','BEGIN (RSA|OPENSSH|EC) PRIVATE KEY','ghp_[A-Za-z0-9]{30,}')
          $hits = foreach ($p in $secretPatterns) { $allFiles | Select-String -Pattern $p }
          if ($hits) { $hits | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/secret-scan.log'; throw 'Potential plaintext secret detected.' }
          'PASS: no configured secret patterns found.' | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/secret-scan.log'
          $codeFiles = Get-ChildItem 'NEWAGE_WORSHIP' -Recurse -File -Include *.cs,*.json,*.yml,*.yaml
          $billing = $codeFiles | Select-String -Pattern 'billingEnabled\s*[:=]\s*true|autoCharge\s*[:=]\s*true|allowPaidFallback\s*[:=]\s*true' -CaseSensitive:$false
          if ($billing) { $billing | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/cost-scan.log'; throw 'Potential automatic spend path detected.' }
          'PASS: no automatic spend marker found in executable/configuration paths.' | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/cost-scan.log'

      - name: Resolve Inno Setup build dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 -y --no-progress 2>&1 | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/innosetup-install.log'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            "Using runner-provided Inno Setup at $iscc" | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/innosetup-install.log'
          }
          $versionInfo = (Get-Item $iscc).VersionInfo
          $version = if ($versionInfo.FileVersion) { $versionInfo.FileVersion } elseif ($versionInfo.ProductVersion) { $versionInfo.ProductVersion } else { 'version-not-exposed-by-file-metadata' }
          "Inno Setup version=$version; executable=$iscc; source=GitHub-hosted Windows image or pinned Chocolatey fallback; zero-cost build dependency." | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/build-dependencies.txt'

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc 'NEWAGE_WORSHIP/installer/NewAgeWorship.iss' 2>&1 | Tee-Object 'NEWAGE_WORSHIP/TEST_EVIDENCE/installer-build.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = 'NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Expected installer was not produced.' }
          Get-FileHash -Algorithm SHA256 $installer | Format-List | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/installer-sha256.txt'

      - name: Install launch and uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe').Path
          if ((Get-Item $installer).Length -lt 100000) { throw 'Installer is suspiciously small.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'NewAgeWorshipInstalled'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR=' + '"' + $installDir + '"'))
          $install = Start-Process -FilePath $installer -ArgumentList $args -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $desktop = Join-Path $installDir 'NewAgeWorship.exe'
          $hostExe = Join-Path $installDir 'ProgramHost/NewAgeWorship.ProgramHost.exe'
          if (-not (Test-Path $desktop)) { throw 'Installed desktop executable is missing.' }
          if (-not (Test-Path $hostExe)) { throw 'Installed Program Host executable is missing.' }
          $host = Start-Process -FilePath $hostExe -PassThru
          Start-Sleep -Seconds 3
          $host.Refresh()
          if ($host.HasExited) { throw "Program Host exited during launch smoke test with code $($host.ExitCode)" }
          Stop-Process -Id $host.Id -Force
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller is missing.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path $desktop) { throw 'Desktop executable remains after uninstall.' }
          @(
            'PASS: installer executed silently',
            'PASS: NewAgeWorship.exe installed',
            'PASS: ProgramHost installed and stayed alive for 3 seconds',
            'PASS: uninstaller executed silently and removed desktop executable'
          ) | Out-File 'NEWAGE_WORSHIP/TEST_EVIDENCE/installer-smoke.log'

      - name: Upload Windows 7 engineering release candidate
        uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-Windows7-Foundation
          path: |
            NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe
            NEWAGE_WORSHIP/TEST_EVIDENCE/**
            NEWAGE_WORSHIP/VERIFICATION_REPORT.html
            NEWAGE_WORSHIP/HARDWARE_ACCEPTANCE_CHECKLIST.html
            NEWAGE_WORSHIP/IMPLEMENTATION_STATE.json
            NEWAGE_WORSHIP/IMPLEMENTATION_LEDGER.md
            NEWAGE_WORSHIP/ENVIRONMENT_REPORT.md
          if-no-files-found: error
          retention-days: 7
