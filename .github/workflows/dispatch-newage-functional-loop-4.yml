name: Dispatch NEWAGE functional loop V3 retry
on:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/dispatch-newage-functional-loop-4.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch functional V3 at current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run newage-functional-integration-loop-v3.yml --repo Veektall/LightWorship --ref newage-worship-v1.0.0
