name: Pixel Subway Acquire Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixel-subway-acquire-temp.yml'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pss-acquire
          cd /tmp/pss-acquire
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Download authentic itch.io files
        run: |
          cat > /tmp/pss-acquire/download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';
          const out='/tmp/pss-files'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const context=await browser.newContext({acceptDownloads:true,viewport:{width:1280,height:900}});

          async function openDownloads(){
            const page=await context.newPage();
            await page.goto('https://lumis-dev.itch.io/pixel-subway-surfers/purchase',{waitUntil:'domcontentloaded',timeout:60000});
            const free=page.getByText('No thanks, just take me to the downloads',{exact:false}).first();
            await free.waitFor({state:'visible',timeout:30000});
            await free.click();
            await page.waitForTimeout(1600);
            return page;
          }
          async function grab(page,uploadId,filename){
            const btn=page.locator(`a.download_btn[data-upload_id="${uploadId}"]`);
            await btn.waitFor({state:'visible',timeout:30000});
            console.log('CLICK',filename,uploadId,page.url());
            const downloadPromise=page.waitForEvent('download',{timeout:60000});
            await btn.click({force:true});
            const d=await downloadPromise;
            const dest=path.join(out,filename);
            await d.saveAs(dest);
            console.log('SAVED',dest,fs.statSync(dest).size,await d.suggestedFilename());
            await page.close();
          }

          let page=await openDownloads();
          await grab(page,'11488281','PSSSourcecode.zip');
          page=await openDownloads();
          await grab(page,'11488283','PSSLinux.zip');
          await browser.close();
          EOF
          cd /tmp/pss-acquire
          node download.mjs
      - name: Inventory
        if: always()
        run: ls -lah /tmp/pss-files || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-subway-authentic-both
          path: /tmp/pss-files
          if-no-files-found: error
          retention-days: 1
