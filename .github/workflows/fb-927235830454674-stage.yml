name: Stage Facebook reel 927235830454674
on:
  push:
    branches: [fb-927235830454674-stage]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Download and stage reel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out .gemini-bridge/jobs
          URL='https://www.facebook.com/reel/927235830454674?sfnsn=scwspwa&mibextid=6AJuK9'
          yt-dlp --no-playlist --write-info-json -o 'out/facebook-reel-927235830454674.%(ext)s' "$URL"
          test -f out/facebook-reel-927235830454674.mp4
          cp out/facebook-reel-927235830454674.mp4 .gemini-bridge/jobs/facebook-reel-927235830454674.mp4
          sha256sum out/facebook-reel-927235830454674.mp4 > out/sha256.txt
          echo ok > out/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/facebook-reel-927235830454674.mp4
          git commit -m 'Stage Facebook reel 927235830454674 for Gemini [skip ci]'
          git push origin HEAD:fb-927235830454674-stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facebook-reel-927235830454674
          path: out/
          retention-days: 1
