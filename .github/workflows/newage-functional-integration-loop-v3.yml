name: NEWAGE WORSHIP Functional Integration Loop V3

on:
  workflow_dispatch:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/newage-functional-integration-loop-v3.yml']

permissions:
  contents: read

jobs:
  functional:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and apply functional overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$names=@('.newage-bootstrap/source.b64.part00','.newage-bootstrap/source.b64.part01','.newage-bootstrap/source.b64.fix020','.newage-bootstrap/source.b64.fix021','.newage-bootstrap/source.b64.part03','.newage-bootstrap/source.b64.part04','.newage-bootstrap/source.b64.part05');$b64=($names|ForEach-Object{(Get-Content $_ -Raw).Trim()}) -join '';$zip=Join-Path $env:RUNNER_TEMP 'NW_CODE.zip';[IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64));if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()-ne'e4536533827c313e18da37f1b645ffe0532a95c5b6f1e77f77d98f86c03e8424'){throw 'source hash mismatch'};Expand-Archive $zip . -Force
          $desktop='NEWAGE_WORSHIP/src/NewAgeWorship.Desktop';$core='NEWAGE_WORSHIP/src/NewAgeWorship.Core/Services';Add-Type -AssemblyName System.IO.Compression.FileSystem;$z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path '.newage-redesign/overlay-v5.zip'));try{$entry=$z.Entries|Where-Object{$_.FullName-eq'MainWindow.xaml'}|Select-Object -First 1;[IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path (Resolve-Path $desktop) 'MainWindow.xaml'),$true)}finally{$z.Dispose()};git apply --directory=$desktop '.newage-functional-v3/MainWindow.xaml.patch';if($LASTEXITCODE-ne 0){throw 'XAML patch failed'};git apply --directory=$desktop '.newage-functional-v3/AssistScroll.patch';if($LASTEXITCODE-ne 0){throw 'scroll patch failed'}
          Copy-Item '.newage-functional-v3/MainWindow.xaml.cs' "$desktop/MainWindow.xaml.cs" -Force;Copy-Item '.newage-functional-v3/BibleLibrary.cs' "$desktop/BibleLibrary.cs" -Force;Copy-Item '.newage-functional-v3/LocalAiAssistant.cs' "$desktop/LocalAiAssistant.cs" -Force;Copy-Item '.newage-functional-v3/VoskSpeechService.cs' "$desktop/VoskSpeechService.cs" -Force;Copy-Item '.newage-functional-v3/WhisperSpeechService.cs' "$desktop/WhisperSpeechService.cs" -Force;Copy-Item '.newage-functional-v3/MixerAudioService.cs' "$desktop/MixerAudioService.cs" -Force;Copy-Item '.newage-functional-v3/NewAgeWorship.Desktop.csproj' "$desktop/NewAgeWorship.Desktop.csproj" -Force;Copy-Item '.newage-functional-v3/ScriptureReferenceParser.cs' "$core/ScriptureReferenceParser.cs" -Force
      - name: Generate deterministic Bible fixture
        shell: pwsh
        run: |
          $d='NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/Data';New-Item -ItemType Directory -Force $d|Out-Null;$py=@'
          import json,zipfile,pathlib
          books=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation']
          verses={'16':'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.','17':'For God sent not his Son into the world to condemn the world; but that the world through him might be saved.','18':'He that believeth on him is not condemned: but he that believeth not is condemned already.'}
          out=pathlib.Path(r'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/Data/Bible_Versions.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for code in ['AMP','GNT','HCSB','KJV','MSG','NIV','NKJV','NLT']:
              data={b:{} for b in books};data['John']={'3':dict(verses)}
              if code=='MSG':data['John']['3']={'16-18':' '.join(verses[str(i)] for i in (16,17,18))}
              z.writestr(code+'.json',json.dumps({'version':code,'books':data},separators=(',',':')))
          '@;Set-Content fixture.py $py -Encoding UTF8;python fixture.py
      - name: Install offline runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$desktop=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop').Path;$tmp=Join-Path $env:RUNNER_TEMP 'nw-assets';New-Item -ItemType Directory -Force $tmp|Out-Null
          curl.exe -L --fail --retry 3 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -o "$tmp/vosk.zip";Expand-Archive "$tmp/vosk.zip" "$tmp/vosk" -Force;New-Item -ItemType Directory -Force "$desktop/Models"|Out-Null;Copy-Item "$tmp/vosk/vosk-model-small-en-us-0.15" "$desktop/Models/vosk-model-small-en-us-0.15" -Recurse -Force
          $wr=Invoke-RestMethod 'https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest';$wa=$wr.assets|Where-Object{$_.name-eq'whisper-bin-x64.zip'}|Select-Object -First 1;curl.exe -L --fail --retry 3 $wa.browser_download_url -o "$tmp/w.zip";Expand-Archive "$tmp/w.zip" "$tmp/w" -Force;$we=Get-ChildItem "$tmp/w" -Recurse -Filter whisper-cli.exe|Select-Object -First 1;New-Item -ItemType Directory -Force "$desktop/AI/whisper"|Out-Null;Copy-Item "$($we.Directory.FullName)/*" "$desktop/AI/whisper" -Recurse -Force;New-Item -ItemType Directory -Force "$desktop/Models/whisper"|Out-Null;curl.exe -L --fail --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin?download=true' -o "$desktop/Models/whisper/ggml-tiny.en.bin"
          $lr=Invoke-RestMethod 'https://api.github.com/repos/ggml-org/llama.cpp/releases/latest';$la=$lr.assets|Where-Object{$_.name-match'bin-win-cpu-x64\.zip$'}|Select-Object -First 1;if(-not $la){$la=$lr.assets|Where-Object{$_.name-match'win.*x64.*\.zip$' -and $_.name-notmatch'cuda|vulkan|sycl|hip|arm'}|Select-Object -First 1};curl.exe -L --fail --retry 3 $la.browser_download_url -o "$tmp/l.zip";Expand-Archive "$tmp/l.zip" "$tmp/l" -Force;$le=Get-ChildItem "$tmp/l" -Recurse -Filter llama-cli.exe|Select-Object -First 1;New-Item -ItemType Directory -Force "$desktop/AI/llama"|Out-Null;Copy-Item "$($le.Directory.FullName)/*" "$desktop/AI/llama" -Recurse -Force;New-Item -ItemType Directory -Force "$desktop/AI/models"|Out-Null;curl.exe -L --fail --retry 3 'https://huggingface.co/unsloth/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf?download=true' -o "$desktop/AI/models/SmolLM2-360M-Instruct-Q4_K_M.gguf";$h=(Get-FileHash "$desktop/AI/models/SmolLM2-360M-Instruct-Q4_K_M.gguf" -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne'16c7f1667fea34bacad196a57b548effcb37614db4ab5677a20c8c7b823b9e63'){throw 'model hash mismatch'}
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with: {nuget-version: '6.12.1'}
      - name: Build
        shell: pwsh
        run: |
          msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /t:Restore /p:RestorePackagesConfig=true /v:minimal;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /m /p:Configuration=Release /p:Platform="Any CPU" /v:minimal;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - name: Functional acceptance
        shell: pwsh
        run: |
          $code=@'
          using System;using System.IO;using System.Speech.AudioFormat;using System.Speech.Synthesis;using NewAgeWorship.Core.Services;using NewAgeWorship.Desktop;
          public static class T{static void N(bool x,string m){if(!x)throw new Exception(m);}[STAThread]public static void Main(){var root=AppDomain.CurrentDomain.BaseDirectory;var report=Path.Combine(root,"functional-test-report.txt");File.WriteAllText(report,"NEWAGE functional acceptance\r\n");var d=Path.Combine(Path.GetTempPath(),Guid.NewGuid().ToString("N"));Directory.CreateDirectory(d);using(var b=new BibleLibrary(d,Path.Combine(root,"Data","Bible_Versions.zip"))){N(b.Translations.Count==8,"Bible count");var p=new ScriptureReferenceParser();ScriptureReference r;N(p.TryParse("John 3:16",out r),"typed parser");BiblePassage v;N(b.TryGetPassage(r,"KJV",out v)&&v.Text.IndexOf("God so loved",StringComparison.OrdinalIgnoreCase)>=0,"KJV lookup");N(b.Search("only begotten Son","KJV",5).Count>0,"Bible search");BiblePassage g;N(b.TryGetPassage(r,"MSG",out g)&&g.Reference.EndsWith(":16-18"),"range grouping");ScriptureReference sr;N(p.TryParseSpoken("john three sixteen",out sr),"spoken parser");File.AppendAllText(report,"PASS Bible 8 versions lookup search grouped-range spoken-reference\r\n");}var z=new byte[32000];N(AudioHealthAnalyzer.AnalyzePcm16(z,z.Length,48000,"fixture").Status=="SILENT","silent");var a=new byte[32000];for(int i=0;i<a.Length/2;i++){short s=(short)(10000*Math.Sin(2*Math.PI*440*i/48000.0));a[i*2]=(byte)s;a[i*2+1]=(byte)(s>>8);}N(AudioHealthAnalyzer.AnalyzePcm16(a,a.Length,48000,"fixture").Status=="HEALTHY","healthy");var c=new byte[32000];for(int i=0;i<c.Length/2;i++){c[i*2]=255;c[i*2+1]=127;}N(AudioHealthAnalyzer.AnalyzePcm16(c,c.Length,48000,"fixture").Status=="CLIPPING","clip");File.AppendAllText(report,"PASS Mixer analyzer\r\n");var ai=new LocalAiAssistant(root);N(ai.IsReady,"AI assets");var ans=ai.CompleteAsync("Give one concise operator note: John 3:16 is prepared in Preview and needs human approval.").GetAwaiter().GetResult();N(!String.IsNullOrWhiteSpace(ans)&&ans.IndexOf("failed safely",StringComparison.OrdinalIgnoreCase)<0&&ans.IndexOf("timed out",StringComparison.OrdinalIgnoreCase)<0,"AI inference: "+ans);File.AppendAllText(report,"PASS Local AI: "+ans+"\r\n");var wav=Path.Combine(root,"john-three-sixteen.wav");using(var s=new SpeechSynthesizer()){s.SetOutputToWaveFile(wav,new SpeechAudioFormatInfo(16000,AudioBitsPerSample.Sixteen,AudioChannel.Mono));s.Speak("John three sixteen");}using(var vs=new VoskSpeechService(Path.Combine(root,"Models","vosk-model-small-en-us-0.15"))){var vt=vs.TranscribeWaveFile(wav);N(!String.IsNullOrWhiteSpace(vt),"Vosk empty");File.AppendAllText(report,"PASS Vosk: "+vt+"\r\n");}var ws=new WhisperSpeechService(root);N(ws.IsReady,"Whisper assets");var wt=ws.TranscribeWaveFile(wav);N(!String.IsNullOrWhiteSpace(wt),"Whisper empty");File.AppendAllText(report,"PASS Whisper: "+wt+"\r\nALL FUNCTIONAL GATES PASSED\r\n");Console.WriteLine(File.ReadAllText(report));}}
          '@;Set-Content T.cs $code -Encoding UTF8;$out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path;$csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$ref=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8';& $csc /nologo /target:exe /out:"$out\FunctionalAcceptance.exe" /reference:"$out\NewAgeWorship.exe" /reference:"$out\NewAgeWorship.Core.dll" /reference:"$out\System.Data.SQLite.dll" /reference:"$out\NAudio.dll" /reference:"$out\Vosk.dll" /reference:"$ref\System.Speech.dll" T.cs;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};Push-Location $out;& .\FunctionalAcceptance.exe;$ec=$LASTEXITCODE;Pop-Location;if($ec-ne 0){exit $ec};Copy-Item "$out/functional-test-report.txt" .;Copy-Item "$out/john-three-sixteen.wav" .
      - name: Actual WPF functional capture
        shell: pwsh
        run: |
          $code=@'
          using System;using System.IO;using System.Reflection;using System.Threading.Tasks;using System.Windows;using System.Windows.Controls;using System.Windows.Media;using System.Windows.Media.Imaging;using System.Windows.Threading;using NewAgeWorship.Desktop;
          public static class C{[STAThread]public static void Main(){Directory.CreateDirectory("functional-capture");var app=new Application();var w=new MainWindow();w.Width=1440;w.Height=900;w.Show();P(1000);S(w,"functional-capture/01-ready.png");var q=(TextBox)w.FindName("CommandBox");q.Text="John 3:16";I(w,"LookupBible_Click");P(400);S(w,"functional-capture/02-bible-lookup.png");I(w,"ParseScripture_Click");P(500);S(w,"functional-capture/03-bible-preview.png");((TextBox)w.FindName("AiPromptBox")).Text="Give one concise operator note: John 3:16 is prepared in Preview and needs human approval.";I(w,"AiAssist_Click");U(()=>((Button)w.FindName("AiAssistButton")).IsEnabled,60000);S(w,"functional-capture/04-local-ai.png");var m=typeof(MainWindow).GetMethod("ProcessAudioFileAsync",BindingFlags.NonPublic|BindingFlags.Instance);var t=(Task)m.Invoke(w,new object[]{Path.Combine(AppDomain.CurrentDomain.BaseDirectory,"john-three-sixteen.wav")});U(()=>t.IsCompleted,60000);if(t.IsFaulted)throw t.Exception;((ScrollViewer)w.FindName("AssistScroll")).ScrollToEnd();P(500);S(w,"functional-capture/05-audio-voice.png");w.Close();app.Shutdown();}static void I(MainWindow w,string n){typeof(MainWindow).GetMethod(n,BindingFlags.NonPublic|BindingFlags.Instance).Invoke(w,new object[]{w,new RoutedEventArgs()});}static void P(int ms){var f=new DispatcherFrame();var t=new DispatcherTimer{Interval=TimeSpan.FromMilliseconds(ms)};t.Tick+=(s,e)=>{t.Stop();f.Continue=false;};t.Start();Dispatcher.PushFrame(f);}static void U(Func<bool>d,int ms){var s=DateTime.UtcNow;while(!d()){if((DateTime.UtcNow-s).TotalMilliseconds>ms)throw new TimeoutException();P(100);}}static void S(Window w,string p){w.UpdateLayout();var b=new RenderTargetBitmap((int)w.ActualWidth,(int)w.ActualHeight,96,96,PixelFormats.Pbgra32);b.Render(w);var e=new PngBitmapEncoder();e.Frames.Add(BitmapFrame.Create(b));using(var f=File.Create(p))e.Save(f);}}
          '@;Set-Content C.cs $code -Encoding UTF8;$out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path;Copy-Item john-three-sixteen.wav "$out/john-three-sixteen.wav" -Force;$csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$ref=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8';& $csc /nologo /target:exe /out:"$out\CaptureFunctional.exe" /reference:"$out\NewAgeWorship.exe" /reference:"$out\NewAgeWorship.Core.dll" /reference:"$ref\WindowsBase.dll" /reference:"$ref\PresentationCore.dll" /reference:"$ref\PresentationFramework.dll" /reference:"$ref\System.Xaml.dll" C.cs;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE};Push-Location $out;& .\CaptureFunctional.exe;$ec=$LASTEXITCODE;Pop-Location;if($ec-ne 0){exit $ec};New-Item -ItemType Directory -Force functional-capture|Out-Null;Copy-Item "$out/functional-capture/*.png" functional-capture/
      - uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-Functional-Acceptance-V3
          path: |
            functional-test-report.txt
            functional-capture/*.png
            john-three-sixteen.wav
          if-no-files-found: error
          retention-days: 7
