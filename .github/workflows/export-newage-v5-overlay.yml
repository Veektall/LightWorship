name: Export NEWAGE V5 overlay
on:
  workflow_dispatch:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/export-newage-v5-overlay.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-V5-Overlay-Export
          path: .newage-redesign/overlay-v5.zip
          retention-days: 2
