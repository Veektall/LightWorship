name: Stage Instagram reel DfEh3TcSBj9 for Gemini
on:
  push:
    branches: [ig-DfEh3TcSBj9-20261029]
permissions:
  contents: write
jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ig-DfEh3TcSBj9-20261029
          persist-credentials: true
      - name: Download reel
        run: |
          python -m pip install -U yt-dlp
          mkdir -p .gemini-bridge/jobs
          yt-dlp --no-playlist --merge-output-format mp4 \
            -o '.gemini-bridge/jobs/instagram-DfEh3TcSBj9.%(ext)s' \
            'https://www.instagram.com/reel/DfEh3TcSBj9/'
          ls -lh .gemini-bridge/jobs/instagram-DfEh3TcSBj9.mp4
      - name: Commit media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/instagram-DfEh3TcSBj9.mp4
          git commit -m '[stage-done] stage instagram reel DfEh3TcSBj9'
          git push origin HEAD:ig-DfEh3TcSBj9-20261029
