name: Fetch Instagram reel DfEh3TcSBj9
on:
  push:
    branches: [ig-DfEh3TcSBj9-20261029]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp
      - name: Download Instagram reel
        run: |
          mkdir -p out
          yt-dlp --no-playlist --merge-output-format mp4 --write-info-json \
            -o 'out/instagram-DfEh3TcSBj9.%(ext)s' \
            'https://www.instagram.com/reel/DfEh3TcSBj9/'
          ffprobe -v error -show_entries format=duration,size -show_streams -of json out/instagram-DfEh3TcSBj9.mp4 > out/ffprobe.json
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-DfEh3TcSBj9
          path: out/
          retention-days: 2
