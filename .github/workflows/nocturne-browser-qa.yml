name: NOCTURNE browser QA

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  qa:
    if: startsWith(github.event.issue.title, 'nocturne-qa:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1

      - name: Test desktop and mobile render
        env:
          SITE_URL: https://raw.githack.com/Veektall/LightWorship/main/site/index.html
        shell: bash
        run: |
          cat > nocturne-qa.mjs <<'JS'
          import { chromium } from 'playwright';

          const url = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl'] });
          const cases = [
            { name: 'desktop', viewport: { width: 1440, height: 900 }, touch: false },
            { name: 'mobile', viewport: { width: 390, height: 844 }, touch: true }
          ];
          const results = [];

          for (const test of cases) {
            const context = await browser.newContext({
              viewport: test.viewport,
              hasTouch: test.touch,
              isMobile: test.touch,
              deviceScaleFactor: 1
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForSelector('#hero-title', { state: 'visible', timeout: 30000 });
            await page.waitForTimeout(2500);

            const title = await page.title();
            const heading = await page.locator('#hero-title').innerText();
            const dimensions = await page.evaluate(() => ({
              bodyWidth: document.body.scrollWidth,
              viewportWidth: document.documentElement.clientWidth,
              canvasVisible: Boolean(document.querySelector('#artifactCanvas')?.getBoundingClientRect().width),
              fallbackVisible: getComputedStyle(document.querySelector('#artifactFallback')).display !== 'none'
            }));
            if (!title.includes('NOCTURNE')) throw new Error(`${test.name}: wrong title ${title}`);
            if (!/museum for tomorrows/i.test(heading)) throw new Error(`${test.name}: hero heading missing`);
            if (dimensions.bodyWidth > dimensions.viewportWidth + 2) throw new Error(`${test.name}: horizontal overflow ${dimensions.bodyWidth}/${dimensions.viewportWidth}`);
            if (!dimensions.canvasVisible && !dimensions.fallbackVisible) throw new Error(`${test.name}: neither WebGL canvas nor fallback is visible`);

            await page.locator('#exploreButton').click({ timeout: 15000 });
            await page.waitForTimeout(1600);
            const archiveVisible = await page.locator('#archive-title').isVisible();
            if (!archiveVisible) throw new Error(`${test.name}: archive did not become visible after CTA`);

            await page.screenshot({ path: `/tmp/nocturne-${test.name}.png`, fullPage: false });
            results.push({ name: test.name, title, heading, dimensions, archiveVisible, errors });
            await context.close();
          }

          await browser.close();
          const fatal = results.flatMap(result => result.errors.filter(error => !/favicon|ERR_BLOCKED_BY_CLIENT|WebGL: CONTEXT_LOST_WEBGL/i.test(error)));
          console.log(JSON.stringify(results, null, 2));
          if (fatal.length) throw new Error(`Browser console errors: ${fatal.join(' | ')}`);
          JS
          set +e
          node ./nocturne-qa.mjs > /tmp/nocturne-qa.log 2>&1
          status=$?
          set -e
          cat /tmp/nocturne-qa.log
          exit "$status"

      - name: Report browser QA success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "NOCTURNE browser QA passed on 1440×900 desktop and 390×844 mobile. The live page rendered, had no horizontal overflow or fatal console errors, and the Explore CTA revealed the archive. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report browser QA failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          printf 'NOCTURNE browser QA failed. Workflow run: %s/%s/actions/runs/%s\n\n```text\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/qa-comment.md
          if [[ -s /tmp/nocturne-qa.log ]]; then
            tail -c 5000 /tmp/nocturne-qa.log >> /tmp/qa-comment.md
          else
            printf 'The failure occurred before the browser test produced output.\n' >> /tmp/qa-comment.md
          fi
          printf '\n```\n' >> /tmp/qa-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/qa-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason not_planned
