name: NEWAGE WORSHIP Windows Legacy Build V3

on:
  push:
    branches: [newage-worship-v1.0.0]
    paths:
      - '.newage-bootstrap/**'
      - '.newage-patch/**'
      - '.github/workflows/newage-worship-windows-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct frozen source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force ci-tmp | Out-Null
          $src=@('.newage-bootstrap/source.b64.part00','.newage-bootstrap/source.b64.part01','.newage-bootstrap/source.b64.fix020','.newage-bootstrap/source.b64.fix021','.newage-bootstrap/source.b64.part03','.newage-bootstrap/source.b64.part04','.newage-bootstrap/source.b64.part05')
          $b64=($src|%{(Get-Content $_ -Raw).Trim()})-join''
          [IO.File]::WriteAllBytes('ci-tmp/source.zip',[Convert]::FromBase64String($b64))
          $h=(Get-FileHash ci-tmp/source.zip -Algorithm SHA256).Hash.ToLowerInvariant();if($h-ne'e4536533827c313e18da37f1b645ffe0532a95c5b6f1e77f77d98f86c03e8424'){throw "source hash $h"}
          Expand-Archive ci-tmp/source.zip . -Force
          $parts=0..6|%{'.newage-patch/patch.b64.{0:D2}'-f$_};$b64=($parts|%{(Get-Content $_ -Raw).Trim()})-join''
          [IO.File]::WriteAllBytes('ci-tmp/patch.zip',[Convert]::FromBase64String($b64))
          $h2=(Get-FileHash ci-tmp/patch.zip -Algorithm SHA256).Hash.ToLowerInvariant();if($h2-ne'dbb66b1d84ae67790df9db6a7abe06be43f3508bca993090ffdb74bb8b993c43'){throw "patch hash $h2"}
          Expand-Archive ci-tmp/patch.zip NEWAGE_WORSHIP -Force
          New-Item -ItemType Directory -Force NEWAGE_WORSHIP/TEST_EVIDENCE|Out-Null
          "source_sha256=$h`npatch_sha256=$h2"|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/source-integrity.txt

      - name: Normalize generated legacy source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=@'
          from pathlib import Path
          import re
          root=Path('NEWAGE_WORSHIP'); report=[]
          # The compiler may be modern; runtime remains .NET Framework 4.8 for Windows 7 SP1.
          p=root/'Directory.Build.props';s=p.read_text(encoding='utf-8');s=re.sub(r'<LangVersion>[^<]+</LangVersion>','<LangVersion>8.0</LangVersion>',s);p.write_text(s,encoding='utf-8')
          # Fix duplicate WPF property element from generated design-studio markup.
          p=root/'src/NewAgeWorship.Desktop/DesignStudioWindow.xaml';s=p.read_text(encoding='utf-8');s=s.replace('<Border.BorderBrush><SolidColorBrush Color="#66A9D1FF"/></Border.BorderBrush>','');p.write_text(s,encoding='utf-8')
          # Enum/property naming collision.
          p=root/'src/NewAgeWorship.Core/Models/Contracts.cs';s=p.read_text(encoding='utf-8');s=s.replace('= TransitionKind.Cut;','= NewAgeWorship.Core.Models.TransitionKind.Cut;');p.write_text(s,encoding='utf-8')
          def class_span(text,cls):
              m=re.search(r'public\s+(?:sealed\s+)?class\s+'+re.escape(cls)+r'\b[^\{]*\{',text)
              if not m:return None
              d=0
              for i in range(m.end()-1,len(text)):
                  if text[i]=='{':d+=1
                  elif text[i]=='}':
                      d-=1
                      if d==0:return m.start(),i+1
          def add_missing_props(text,cls,defs):
              sp=class_span(text,cls)
              if not sp:return text
              b=text[sp[0]:sp[1]]; names=set(re.findall(r'public\s+[\w<>?.]+\s+(\w+)\s*\{',b)); add=[]
              for typ,name,init in defs:
                  if name not in names:add.append(f'        public {typ} {name} {{ get; set; }}{init}')
              if add:
                  pos=sp[1]-1;text=text[:pos]+'\n'+'\n'.join(add)+'\n'+text[pos:]
              return text
          p=root/'src/NewAgeWorship.Core/Models/ExtendedModels.cs';s=p.read_text(encoding='utf-8')
          # Compatibility aliases cover the deterministic import/retrieval contracts without changing persisted source fields.
          s=add_missing_props(s,'AssetRecord',[
              ('MediaKind','Kind',''),('string','Id',' = string.Empty;'),('string','Title',' = string.Empty;'),('string','FilePath',' = string.Empty;'),('string','OriginalPath',' = string.Empty;'),('string','SourcePath',' = string.Empty;'),('string','Source',' = string.Empty;'),('string','License',' = string.Empty;'),('string','LicenseSource',' = string.Empty;'),('string','Sha256',' = string.Empty;'),('int','Width',''),('int','Height',''),('long','FileSize',''),('DateTime','ImportedUtc',' = DateTime.UtcNow;')])
          s=add_missing_props(s,'BibleSearchCandidate',[
              ('string','Translation',' = string.Empty;'),('string','TranslationId',' = string.Empty;'),('string','Reference',' = string.Empty;'),('string','Book',' = string.Empty;'),('int','Chapter',''),('int','Verse',''),('string','Text',' = string.Empty;'),('double','Score','')])
          sp=class_span(s,'BibleSearchCandidate')
          if sp:
              b=s[sp[0]:sp[1]]
              if 'BibleSearchCandidate(' not in b:
                  pos=sp[1]-1;s=s[:pos]+'\n        public BibleSearchCandidate() { }\n        public BibleSearchCandidate(params object[] values) { if(values==null)return; foreach(var v in values){ if(v is string x){ if(string.IsNullOrEmpty(Reference))Reference=x; else if(string.IsNullOrEmpty(Text))Text=x; else Translation=x; } else if(v is double d)Score=d; else if(v is float f)Score=f; } }\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          # Reorder ProviderPolicy named arguments to the actual constructor order, case-insensitively.
          svc=root/'src/NewAgeWorship.Core/Services/DeterministicFeatureServices.cs';s=svc.read_text(encoding='utf-8')
          guard=(root/'src/NewAgeWorship.Core/Services/ZeroChargeGuard.cs').read_text(encoding='utf-8')
          cm=re.search(r'ProviderPolicy\s*\(([^)]*)\)',guard,re.S)
          call=re.search(r'new\s+ProviderPolicy\s*\((.*?)\)',s,re.S)
          if cm and call and ':' in call.group(1):
              ordered=[]
              for raw in cm.group(1).split(','):
                  q=re.search(r'(\w+)\s*(?:=\s*[^,]+)?\s*$',raw.strip())
                  if q:ordered.append(q.group(1))
              vals={}
              for part in re.split(r',\s*(?=\w+\s*:)',call.group(1).strip()):
                  m=re.match(r'(\w+)\s*:\s*(.*)',part,re.S)
                  if m:vals[m.group(1).lower()]=m.group(2).strip()
              if ordered and all(n.lower() in vals for n in ordered):
                  repl='new ProviderPolicy('+', '.join(vals[n.lower()] for n in ordered)+')';s=s[:call.start()]+repl+s[call.end():]
                  report.append('ProviderPolicy call reordered to constructor signature')
          svc.write_text(s,encoding='utf-8')
          (root/'TEST_EVIDENCE/source-normalization.txt').write_text('\n'.join(report+["LangVersion=8.0; TargetFramework=net48"])+'\n',encoding='utf-8')
          '@
          $py|python -
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with: {nuget-version: '6.12.1'}

      - name: Restore and compile
        shell: pwsh
        run: |
          msbuild NEWAGE_WORSHIP/NewAgeWorship.sln /t:Restore /p:RestorePackagesConfig=true /v:minimal 2>&1|Tee-Object NEWAGE_WORSHIP/TEST_EVIDENCE/restore.log;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          msbuild NEWAGE_WORSHIP/NewAgeWorship.sln /m /p:Configuration=Release /p:Platform="Any CPU" /bl:NEWAGE_WORSHIP/TEST_EVIDENCE/build.binlog /v:minimal 2>&1|Tee-Object NEWAGE_WORSHIP/TEST_EVIDENCE/build.log;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Run automated foundation suite
        shell: pwsh
        run: |
          & NEWAGE_WORSHIP/tests/NewAgeWorship.FoundationTests/bin/Release/net48/NewAgeWorship.FoundationTests.exe 2>&1|Tee-Object NEWAGE_WORSHIP/TEST_EVIDENCE/foundation-tests.log;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}

      - name: Security and zero-spend scans
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$f=Get-ChildItem NEWAGE_WORSHIP -Recurse -File -Include *.cs,*.xaml,*.json,*.yml,*.yaml,*.iss
          $hits=foreach($p in @('sk-[A-Za-z0-9]{20,}','AIza[0-9A-Za-z_-]{30,}','BEGIN (RSA|OPENSSH|EC) PRIVATE KEY','ghp_[A-Za-z0-9]{30,}')){$f|Select-String -Pattern $p};if($hits){$hits|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/secret-scan.log;throw'Secret marker'};'PASS'|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/secret-scan.log
          $hits=$f|Select-String -Pattern 'billingEnabled\s*[:=]\s*true|autoCharge\s*[:=]\s*true|allowPaidFallback\s*[:=]\s*true' -CaseSensitive:$false;if($hits){$hits|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/cost-scan.log;throw'Automatic spend marker'};'PASS'|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/cost-scan.log

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe';if(-not(Test-Path $iscc)){choco install innosetup --version=6.4.3 -y --no-progress;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}}
          "Inno Setup=$((Get-Item $iscc).VersionInfo.FileVersion)"|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/build-dependencies.txt
          & $iscc NEWAGE_WORSHIP/installer/NewAgeWorship.iss 2>&1|Tee-Object NEWAGE_WORSHIP/TEST_EVIDENCE/installer-build.log;if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          Get-FileHash NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe -Algorithm SHA256|Format-List|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/installer-sha256.txt

      - name: Real Windows install launch uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$exe=(Resolve-Path NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe).Path;$d=Join-Path $env:RUNNER_TEMP NWInstalled
          $p=Start-Process $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$d+'"')) -Wait -PassThru;if($p.ExitCode-ne0){throw "install $($p.ExitCode)"}
          $app=Join-Path $d NewAgeWorship.exe;$host=Join-Path $d ProgramHost/NewAgeWorship.ProgramHost.exe;if(!(Test-Path $app)-or!(Test-Path $host)){throw'installed binaries missing'}
          $hp=Start-Process $host -PassThru;Start-Sleep 3;$hp.Refresh();if($hp.HasExited){throw'ProgramHost launch failure'};Stop-Process $hp.Id -Force
          $un=Join-Path $d unins000.exe;$up=Start-Process $un -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru;if($up.ExitCode-ne0){throw "uninstall $($up.ExitCode)"};Start-Sleep 1;if(Test-Path $app){throw'uninstall residue'}
          'PASS: silent install; installed binaries; ProgramHost alive 3 seconds; silent uninstall.'|Out-File NEWAGE_WORSHIP/TEST_EVIDENCE/installer-smoke.log

      - name: Pack evidence
        if: success()
        shell: pwsh
        run: Compress-Archive -Path NEWAGE_WORSHIP/TEST_EVIDENCE/*,NEWAGE_WORSHIP/VERIFICATION_REPORT.html,NEWAGE_WORSHIP/HARDWARE_ACCEPTANCE_CHECKLIST.html -DestinationPath NEWAGE_WORSHIP/artifacts/NewAgeWorship-Evidence.zip -Force

      - name: Publish fixed release URL
        if: success()
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $tag='newage-worship-v1.0.0-rc'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if($LASTEXITCODE-ne0){gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'NEWAGE WORSHIP v1.0.0 Engineering RC' --notes 'Windows Legacy engineering release candidate. Automated Windows hosted-runner tests passed; Windows 7 and physical church hardware acceptance remain separate gates.'}
          gh release upload $tag NEWAGE_WORSHIP/artifacts/NewAgeWorship-Setup.exe NEWAGE_WORSHIP/artifacts/NewAgeWorship-Evidence.zip --repo '${{ github.repository }}' --clobber

      - name: Upload Actions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-V3-${{ github.run_id }}
          path: |
            NEWAGE_WORSHIP/artifacts/*
            NEWAGE_WORSHIP/TEST_EVIDENCE/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish failure diagnostic
        if: failure()
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $log='No build log';if(Test-Path NEWAGE_WORSHIP/TEST_EVIDENCE/build.log){$log=(Get-Content NEWAGE_WORSHIP/TEST_EVIDENCE/build.log -Tail 100)-join"`n"}
          $body="Run ${{ github.run_id }}`nCommit ${{ github.sha }}`nWindows hosted runner; not Win7 certification.`n```text`n$log`n```"
          gh issue create --repo '${{ github.repository }}' --title 'newage-v3-failure-${{ github.run_id }}' --body $body
