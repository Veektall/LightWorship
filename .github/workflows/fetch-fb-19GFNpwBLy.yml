name: Fetch Facebook reel 19GFNpwBLy
on:
  push:
    branches: [fb-19GFNpwBLy-20261003]
permissions:
  contents: write
jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb-19GFNpwBLy-20261003
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp
      - name: Resolve and download video
        run: |
          mkdir -p .gemini-bridge/jobs
          yt-dlp --no-playlist --dump-single-json 'https://www.facebook.com/share/r/19GFNpwBLy/' > .gemini-bridge/jobs/facebook-19GFNpwBLy.info.json
          yt-dlp --no-playlist --merge-output-format mp4 -f 'bv*+ba/b' -o '.gemini-bridge/jobs/facebook-19GFNpwBLy.%(ext)s' 'https://www.facebook.com/share/r/19GFNpwBLy/'
          test -f .gemini-bridge/jobs/facebook-19GFNpwBLy.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams -of json .gemini-bridge/jobs/facebook-19GFNpwBLy.mp4 > .gemini-bridge/jobs/facebook-19GFNpwBLy.ffprobe.json
      - uses: actions/upload-artifact@v4
        with:
          name: facebook-19GFNpwBLy-stage
          path: |
            .gemini-bridge/jobs/facebook-19GFNpwBLy.mp4
            .gemini-bridge/jobs/facebook-19GFNpwBLy.info.json
            .gemini-bridge/jobs/facebook-19GFNpwBLy.ffprobe.json
          retention-days: 1
      - name: Commit staged media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/facebook-19GFNpwBLy.mp4 .gemini-bridge/jobs/facebook-19GFNpwBLy.info.json .gemini-bridge/jobs/facebook-19GFNpwBLy.ffprobe.json
          git commit -m '[stage-done] stage facebook reel 19GFNpwBLy'
          git push origin HEAD:fb-19GFNpwBLy-20261003
