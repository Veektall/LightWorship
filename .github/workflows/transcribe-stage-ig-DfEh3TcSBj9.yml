name: Transcribe and stage Instagram reel DfEh3TcSBj9
on:
  push:
    branches: [ig-DfEh3TcSBj9-20261029]
permissions:
  contents: write
jobs:
  process:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ig-DfEh3TcSBj9-20261029
          persist-credentials: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp openai-whisper
      - name: Download and transcribe
        run: |
          mkdir -p out .gemini-bridge/jobs
          yt-dlp --no-playlist --merge-output-format mp4 \
            -o 'out/instagram-DfEh3TcSBj9.%(ext)s' \
            'https://www.instagram.com/reel/DfEh3TcSBj9/'
          ffmpeg -y -i out/instagram-DfEh3TcSBj9.mp4 -vn -ac 1 -ar 16000 out/audio.wav
          whisper out/audio.wav --model base --language en --output_dir out --output_format all
          cp out/instagram-DfEh3TcSBj9.mp4 .gemini-bridge/jobs/instagram-DfEh3TcSBj9.mp4
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: instagram-DfEh3TcSBj9-transcript
          path: |
            out/audio.txt
            out/audio.srt
            out/audio.vtt
            out/audio.json
          retention-days: 2
      - name: Commit staged media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/instagram-DfEh3TcSBj9.mp4
          git commit -m '[stage-done] stage instagram reel DfEh3TcSBj9'
          git push origin HEAD:ig-DfEh3TcSBj9-20261029
