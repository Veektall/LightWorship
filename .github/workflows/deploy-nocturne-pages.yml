name: Deploy NOCTURNE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.pages/nocturne/**'
      - '.github/workflows/deploy-nocturne-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate NOCTURNE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nocturne-public
          cat .pages/nocturne/chunk-* | base64 -d > /tmp/nocturne.tar.gz
          echo 'dbad5cb596fe34ea523a3f052fb3655f12fa1281ccd4a6e9fab263e693ac9034  /tmp/nocturne.tar.gz' | sha256sum -c -
          tar -xzf /tmp/nocturne.tar.gz -C /tmp/nocturne-public --strip-components=1
          node --check /tmp/nocturne-public/app.js
          test -s /tmp/nocturne-public/styles.css
          test -s /tmp/nocturne-public/index.html
          grep -q 'NOCTURNE' /tmp/nocturne-public/index.html
          grep -q 'artifactCanvas' /tmp/nocturne-public/app.js
          touch /tmp/nocturne-public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/nocturne-public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/page.html && grep -q 'NOCTURNE' /tmp/page.html; then
              echo "Verified $PAGE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Public page did not pass verification" >&2
          exit 1
