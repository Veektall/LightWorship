name: Deploy NOCTURNE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.pages/nocturne/**'
      - '.github/workflows/deploy-nocturne-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nocturne-static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate NOCTURNE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nocturne-public
          mkdir -p /tmp/nocturne-public
          : > /tmp/chunk-01
          for sha in \
            f6de79e149284393d689aba86fb118bf1fe066ad \
            42d239630c6b85b13dff8f27988e060444c29ce4 \
            d52132493398a557f2e03ea56194fb973e82667a \
            2b3681de1ff1c9cb4f7788a38847de6bb463312a \
            7abde45179a22f5e94874cdd189126b5a6c51c7c \
            00c9becb561ff1599a120bcf832b93afe2e16601 \
            19458fa492dc4a4d38cadc183fb6177d546fb9c4 \
            e78cfcf7ad8d51bff76ead27e7199f4d0d5ee172 \
            6f617d2512018e8a7000aa5ec09eb0a828ecde3f \
            c9bf96c9ab2aa8d8af97cbb74ba93032ed07fcaf \
            c8efba1e370d550b0d0420758ef389a93b2ca47b \
            7cea49c90b5ce33fac4875b9e02cf0558ee97ed4
          do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | tr -d '\n' | base64 -d >> /tmp/chunk-01
          done
          cat .pages/nocturne/chunk-00 /tmp/chunk-01 .pages/nocturne/chunk-02 .pages/nocturne/chunk-03 .pages/nocturne/chunk-04 | base64 -d > /tmp/nocturne.tar.gz
          echo 'dbad5cb596fe34ea523a3f052fb3655f12fa1281ccd4a6e9fab263e693ac9034  /tmp/nocturne.tar.gz' | sha256sum -c -
          gzip -t /tmp/nocturne.tar.gz
          tar -xzf /tmp/nocturne.tar.gz -C /tmp/nocturne-public --strip-components=1
          node --check /tmp/nocturne-public/app.js
          test -s /tmp/nocturne-public/styles.css
          test -s /tmp/nocturne-public/index.html
          grep -q 'NOCTURNE' /tmp/nocturne-public/index.html
          grep -q 'artifactCanvas' /tmp/nocturne-public/app.js

      - name: Publish validated static files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp /tmp/nocturne-public/index.html site/index.html
          cp /tmp/nocturne-public/styles.css site/styles.css
          cp /tmp/nocturne-public/app.js site/app.js
          touch site/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site
          if git diff --cached --quiet; then
            echo 'Validated site files are already current.'
          else
            git commit -m 'Publish validated NOCTURNE website'
            git push
          fi

      - name: Verify public static endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/main/site/index.html"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/live.html && grep -q 'NOCTURNE' /tmp/live.html; then
              curl --fail --silent --show-error --location --max-time 20 "https://raw.githack.com/${GITHUB_REPOSITORY}/main/site/styles.css" -o /tmp/live.css
              curl --fail --silent --show-error --location --max-time 20 "https://raw.githack.com/${GITHUB_REPOSITORY}/main/site/app.js" -o /tmp/live.js
              node --check /tmp/live.js
              test -s /tmp/live.css
              echo "Verified $URL"
              exit 0
            fi
            sleep 4
          done
          echo "Public static endpoint did not pass verification" >&2
          exit 1
