name: Gemma Public Artifact Bridge Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: startsWith(github.event.issue.title, 'gemma-public-artifact:') && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Make payload
        run: printf 'public-artifact-bridge-ok\n' > bridge.txt
      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: gemma-public-artifact-test
          path: bridge.txt
          retention-days: 1
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="PUBLIC_ARTIFACT_TEST run=${GITHUB_RUN_ID}"
