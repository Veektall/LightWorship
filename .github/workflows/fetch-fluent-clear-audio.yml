          30 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1a2c53ce-fa2d-45c5-bc6f-db91a639bf7d.mp3
          EOF
          while read -r n url; do
            curl -fL --retry 3 --silent --show-error "$url" -o "clear-audio/day-${n}.mp3"
          done < urls.txt
          test "$(find clear-audio -name '*.mp3' | wc -l)" -eq 30
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent-clear-voice-audio
          path: clear-audio
          retention-days: 2
      - name: Comment run ID
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="Artifact ready. Run ID: ${GITHUB_RUN_ID}."