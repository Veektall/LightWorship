name: Fetch Fluent Clear Audio

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  fetch:
    if: startsWith(github.event.issue.title, 'fetch-fluent-clear:')
    runs-on: ubuntu-latest
    steps:
      - name: Download audio files
        shell: bash
        run: |
          set -euo pipefail
          mkdir clear-audio
          cat > urls.txt <<'EOF'
          01 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/95ee0577-1085-4ad4-bad0-2fe149b1f7b2.mp3
          02 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/33482689-6ea0-44ef-b914-c857f2538506.mp3
          03 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2e0a9fcc-b8ed-449c-91a8-e18bb7e33cf8.mp3
          04 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9c66ebeb-d7dc-4227-a5ca-14e8b49ecce6.mp3
          05 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/3e29c07c-c2b8-4821-9896-b054dea3609e.mp3
          06 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fbb15d96-eb03-4e52-9d72-746048df1663.mp3
          07 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c3cc42de-51fc-471e-8546-959bacd22afe.mp3
          08 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0637a18a-1865-450a-b78d-2b3ed2adbfd4.mp3
          09 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2b863e4b-5bad-4aee-9d09-79aa5afc564f.mp3
          10 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/63bb037f-0505-470b-97cb-4ca1220b5f8e.mp3
          11 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a1a14156-7fe7-45dc-bdb4-c3cb0c8e3e6a.mp3
          12 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/90f0ccdf-e530-4a4a-b04f-ef302f5fe48d.mp3
          13 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/60ce4f78-8d5e-405f-a019-67f3dca87bbd.mp3
          14 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8f7f319c-0694-43c4-b0cf-4e6ac8c2f6bb.mp3
          15 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d7d70c85-2bcd-46df-9cad-f406896fd787.mp3
          16 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ea03f6ba-d749-4620-8507-da24d62c5173.mp3
          17 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c455abb3-f5c4-443e-9301-f51371be1ab9.mp3
          18 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fd4603ad-d74f-452d-92e8-87fdcc5c8376.mp3
          19 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0160f349-2d21-4664-a39d-de0eeb3bb10a.mp3
          20 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8548fae5-2d85-44d9-8e1e-fc2188591802.mp3
          21 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/33f39a77-4f5a-4795-8dd9-c38ce3f083ea.mp3
          22 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e32b38c8-4591-4870-9fa8-11d0b5f4c642.mp3
          23 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d0bdab8a-9d90-4afe-bee0-64c72fde583a.mp3
          24 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/3d53ae92-0b19-48d0-a661-18c978731d40.mp3
          25 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c6e81689-67d1-4c86-9225-f6e4c5968251.mp3
          26 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/5b9baacc-7bd9-4535-8cfb-2fc4df92eabe.mp3
          27 https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0336540b-8583-43a5-ad6b-f59f2ba3a6c3.mp3
