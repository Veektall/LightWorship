name: Sermon Assistant Windows fix v2

on:
  push:
    branches: [sermon-assistant-build]
    paths:
      - '.sermon-assistant-ci/fix-v2/**'
      - '.github/workflows/sermon-assistant-fix-v2.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Restore proven integration harness and compose fixed source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .sermon-assistant-ci\src | Out-Null
          tar -xzf .sermon-assistant-ci\windows-ci-src.tgz -C .sermon-assistant-ci\src
          Get-Content .sermon-assistant-ci\fix-v2\Program.part1,.sermon-assistant-ci\fix-v2\Program.part2,.sermon-assistant-ci\fix-v2\Program.part3,.sermon-assistant-ci\fix-v2\Program.part4,.sermon-assistant-ci\fix-v2\Program.part5 | Set-Content -Encoding UTF8 .sermon-assistant-ci\src\Program.cs
          $src = Get-Content .sermon-assistant-ci\src\Program.cs -Raw
          if ($src -match 'server\.Start\(\);OpenProjection\(') { throw 'Regression: projection still auto-opens' }
          if ($src -notmatch 'START PROJECTION') { throw 'Missing explicit projection start control' }
          if ($src -notmatch 'Keys\.Escape' -or $src -notmatch 'Keys\.F12') { throw 'Missing emergency projection exit keys' }
          if ($src -notmatch 'TopMost=false') { throw 'Projection must not trap operator as TopMost' }

      - name: Compile Windows 7 companion (.NET Framework 4.x, x86)
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw 'Classic .NET Framework 4.x csc.exe not found' }
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:"Sermon Assistant fixed.exe" /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll ".sermon-assistant-ci\src\Program.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "Sermon Assistant fixed.exe" | Format-List Name,Length,LastWriteTime

      - name: Companion self-test
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\Sermon Assistant fixed.exe" -ArgumentList @('--self-test','--self-test-log','self-test.log') -Wait -PassThru
          if ($p.ExitCode -ne 0) { if (Test-Path self-test.log) { Get-Content self-test.log }; exit $p.ExitCode }
          if ((Get-Content self-test.log -Raw) -notmatch 'SELF_TEST_OK') { throw 'Self-test marker missing' }
          Get-Content self-test.log

      - name: Compile actual Android LAN client classes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force java-test | Out-Null
          javac -source 8 -target 8 -d java-test ".sermon-assistant-ci\src\WireProtocol.java" ".sermon-assistant-ci\src\ProjectorClient.java" ".sermon-assistant-ci\src\IntegrationHarness.java"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Android client to fixed Windows companion E2E
        shell: powershell
        run: |
          $p = Start-Process -FilePath ".\Sermon Assistant fixed.exe" -ArgumentList @('--headless','--port','19077','--log','e2e.log','--exit-after','20') -PassThru
          Start-Sleep -Milliseconds 900
          java -cp java-test com.sermonassistant.IntegrationHarness
          $javaExit = $LASTEXITCODE
          Start-Sleep -Milliseconds 800
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($javaExit -ne 0) { if (Test-Path e2e.log) { Get-Content e2e.log }; exit $javaExit }
          $log = Get-Content e2e.log -Raw
          $required = @('STATE|CAPTION||Live caption test','STATE|SCRIPTURE|John 3:16 (NIV)|For God so loved the world','STATE|PRAYER|PRAYER POINT|Father, give us wisdom','STATE|OFFERING|OFFERING|Give with joy','STATE|ANNOUNCEMENTS|ANNOUNCEMENT|Sunday service begins at 8 AM','STATE|CLEAR||')
          foreach ($needle in $required) { if ($log -notlike "*$needle*") { Write-Host $log; throw "Missing E2E state: $needle" } }
          Write-Host $log
          Write-Host 'WINDOWS_ANDROID_E2E_OK'

      - name: Package companion
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release\media | Out-Null
          Copy-Item "Sermon Assistant fixed.exe" release\
          @"
          Sermon Assistant Windows Projection Companion — FIXED BUILD

          1. The app now opens only the operator control window.
          2. Connect HDMI and set Windows display mode to Extend.
          3. Choose the secondary display and click START PROJECTION.
          4. Click STOP / RESTORE to close projection.
          5. Emergency exit from projection: Esc or F12. Double-clicking projection also closes it.
          6. Phone/PC LAN: UDP 9076 discovery, TCP 9077 projection.
          "@ | Set-Content -Encoding UTF8 release\README-WINDOWS-FIX.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sermon-assistant-windows-fix-v2
          path: release/**
          if-no-files-found: error
