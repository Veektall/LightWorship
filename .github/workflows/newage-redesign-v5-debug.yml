name: NEWAGE Redesign V5 Transport Debug
on:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/newage-redesign-v5-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract repository overlay v5
        shell: pwsh
        run: |
          $zip='.newage-redesign/overlay-v5.zip'
          Write-Host "SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          New-Item -ItemType Directory -Force decoded | Out-Null
          Expand-Archive $zip decoded -Force
          Get-ChildItem decoded | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-V5-Transport-Debug
          path: decoded/*
          if-no-files-found: error
          retention-days: 2
