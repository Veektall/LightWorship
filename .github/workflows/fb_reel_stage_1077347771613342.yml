name: Stage Facebook Reel 1077347771613342

on:
  push:
    branches:
      - gemini-fb-1077347771613342
    paths:
      - .github/workflows/fb_reel_stage_1077347771613342.yml

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gemini-fb-1077347771613342
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: python -m pip install --upgrade yt-dlp
      - name: Download full public reel with audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gemini-bridge/jobs
          URL='https://www.facebook.com/reel/1077347771613342/'
          OUT='.gemini-bridge/jobs/facebook-reel-1077347771613342.mp4'
          rm -f "$OUT"
          yt-dlp --no-playlist --write-info-json --recode-video mp4 --max-filesize 95M -o '.gemini-bridge/jobs/facebook-reel-1077347771613342.%(ext)s' "$URL"
          FOUND=$(find .gemini-bridge/jobs -maxdepth 1 -type f -name 'facebook-reel-1077347771613342.*' ! -name '*.status.txt' ! -name '*.info.json' | head -n 1)
          if [ "$FOUND" != "$OUT" ]; then mv "$FOUND" "$OUT"; fi
          test -s "$OUT"
          {
            echo 'status=ok'
            echo "bytes=$(stat -c%s "$OUT")"
            echo "sha256=$(sha256sum "$OUT" | awk '{print $1}')"
          } > .gemini-bridge/jobs/facebook-reel-1077347771613342.status.txt
      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-1077347771613342
          path: |
            .gemini-bridge/jobs/facebook-reel-1077347771613342.mp4
            .gemini-bridge/jobs/facebook-reel-1077347771613342.status.txt
            .gemini-bridge/jobs/facebook-reel-1077347771613342.info.json
          if-no-files-found: error
      - name: Commit staged media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/facebook-reel-1077347771613342.mp4 .gemini-bridge/jobs/facebook-reel-1077347771613342.status.txt .gemini-bridge/jobs/facebook-reel-1077347771613342.info.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Stage Facebook reel 1077347771613342 for Gemini'
            git push origin HEAD:gemini-fb-1077347771613342
          fi
      - name: Publish run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo Veektall/LightWorship --title "fb-stage-run:1077347771613342:${{ github.run_id }}" --body "run_id=${{ github.run_id }}\nartifact=facebook-reel-1077347771613342\nsha=${{ github.sha }}"
