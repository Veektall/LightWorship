name: Dispatch NEWAGE functional loop V2 retry
on:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/dispatch-newage-functional-loop-3.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run newage-functional-integration-loop-v2.yml --repo Veektall/LightWorship --ref newage-worship-v1.0.0
