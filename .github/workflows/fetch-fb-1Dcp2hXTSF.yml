name: Fetch Facebook video 1Dcp2hXTSF
on:
  push:
    branches: [fb-1Dcp2hXTSF-20261013]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[stage-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip yt-dlp
      - name: Download and compress Facebook video
        run: |
          mkdir -p out .gemini-bridge/jobs
          yt-dlp --no-playlist --merge-output-format mp4 --write-info-json             -o 'out/facebook-1Dcp2hXTSF.%(ext)s'             'https://www.facebook.com/share/v/1Dcp2hXTSF/'
          ffmpeg -y -i out/facebook-1Dcp2hXTSF.mp4             -vf 'scale=720:-2' -c:v libx264 -preset veryfast -crf 28             -c:a aac -b:a 96k -movflags +faststart             .gemini-bridge/jobs/facebook-1Dcp2hXTSF-gemini.mp4
          cp out/facebook-1Dcp2hXTSF.info.json .gemini-bridge/jobs/facebook-1Dcp2hXTSF.info.json
          test $(stat -c%s .gemini-bridge/jobs/facebook-1Dcp2hXTSF-gemini.mp4) -lt 100000000
          ls -lh .gemini-bridge/jobs/facebook-1Dcp2hXTSF-gemini.mp4
      - name: Commit compressed media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gemini-bridge/jobs/facebook-1Dcp2hXTSF-gemini.mp4 .gemini-bridge/jobs/facebook-1Dcp2hXTSF.info.json
          git commit -m '[stage-done] stage compressed facebook video 1Dcp2hXTSF'
          git push origin HEAD:fb-1Dcp2hXTSF-20261013
