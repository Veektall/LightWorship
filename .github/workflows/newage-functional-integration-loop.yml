name: NEWAGE WORSHIP Functional Integration Loop

on:
  workflow_dispatch:
  push:
    branches: [newage-worship-v1.0.0]
    paths:
      - '.github/workflows/newage-functional-integration-loop.yml'

permissions:
  contents: read

jobs:
  functional:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $names=@(
            '.newage-bootstrap/source.b64.part00',
            '.newage-bootstrap/source.b64.part01',
            '.newage-bootstrap/source.b64.fix020',
            '.newage-bootstrap/source.b64.fix021',
            '.newage-bootstrap/source.b64.part03',
            '.newage-bootstrap/source.b64.part04',
            '.newage-bootstrap/source.b64.part05'
          )
          $b64=($names|ForEach-Object{(Get-Content $_ -Raw).Trim()}) -join ''
          $zip=Join-Path $env:RUNNER_TEMP 'NW_CODE.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'e4536533827c313e18da37f1b645ffe0532a95c5b6f1e77f77d98f86c03e8424'){throw "source hash mismatch: $actual"}
          Expand-Archive $zip . -Force

      - name: Apply verified V5 shell and functional services
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $desktop='NEWAGE_WORSHIP/src/NewAgeWorship.Desktop'
          $core='NEWAGE_WORSHIP/src/NewAgeWorship.Core/Services'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path '.newage-redesign/overlay-v5.zip'))
          try {
            $entry=$z.Entries | Where-Object {$_.FullName -eq 'MainWindow.xaml'} | Select-Object -First 1
            if(-not $entry){throw 'V5 MainWindow.xaml missing'}
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path (Resolve-Path $desktop) 'MainWindow.xaml'),$true)
          } finally {$z.Dispose()}
          git apply --directory=$desktop '.newage-functional-v3/MainWindow.xaml.patch'
          if($LASTEXITCODE -ne 0){throw 'functional XAML patch failed'}
          git apply --directory=$desktop '.newage-functional-v3/AssistScroll.patch'
          if($LASTEXITCODE -ne 0){throw 'assist scroll patch failed'}
          Copy-Item '.newage-functional-v3/MainWindow.xaml.cs' "$desktop/MainWindow.xaml.cs" -Force
          Copy-Item '.newage-functional-v3/BibleLibrary.cs' "$desktop/BibleLibrary.cs" -Force
          Copy-Item '.newage-functional-v3/LocalAiAssistant.cs' "$desktop/LocalAiAssistant.cs" -Force
          Copy-Item '.newage-functional-v3/VoskSpeechService.cs' "$desktop/VoskSpeechService.cs" -Force
          Copy-Item '.newage-functional-v3/WhisperSpeechService.cs' "$desktop/WhisperSpeechService.cs" -Force
          Copy-Item '.newage-functional-v3/MixerAudioService.cs' "$desktop/MixerAudioService.cs" -Force
          Copy-Item '.newage-functional-v3/NewAgeWorship.Desktop.csproj' "$desktop/NewAgeWorship.Desktop.csproj" -Force
          Copy-Item '.newage-functional-v3/ScriptureReferenceParser.cs' "$core/ScriptureReferenceParser.cs" -Force
          Select-String -Path "$desktop/MainWindow.xaml" -Pattern 'BibleVersionCombo','AiAssistButton','MixerDeviceCombo','AssistScroll' | Out-Host

      - name: Generate rights-safe eight-version compatibility Bible pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $desktop='NEWAGE_WORSHIP/src/NewAgeWorship.Desktop'
          New-Item -ItemType Directory -Force "$desktop/Data" | Out-Null
          $py=@'
          import json, urllib.request, zipfile, pathlib, copy
          url='https://raw.githubusercontent.com/Amosamevor/Bible-json/main/versions/en/KING%20JAMES%20BIBLE.json'
          with urllib.request.urlopen(url, timeout=60) as r:
              base=json.loads(r.read().decode('utf-8-sig'))
          if len(base.get('books',{})) < 66:
              raise SystemExit('KJV compatibility source is incomplete')
          versions=['AMP','GNT','HCSB','KJV','MSG','NIV','NKJV','NLT']
          out=pathlib.Path(r'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/Data/Bible_Versions.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for code in versions:
                  doc=copy.deepcopy(base) if code=='MSG' else dict(base)
                  doc['version']=code
                  if code=='MSG':
                      j=doc['books']['John']['3']
                      grouped=' '.join(j.pop(str(v),'') for v in (16,17,18)).strip()
                      j['16-18']=grouped
                  z.writestr(code+'.json',json.dumps(doc,ensure_ascii=False,separators=(',',':')))
          print(out, out.stat().st_size)
          '@
          Set-Content make_bible_fixture.py $py -Encoding UTF8
          python make_bible_fixture.py

      - name: Install offline speech and AI runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $desktop=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop').Path
          $tmp=Join-Path $env:RUNNER_TEMP 'newage-runtime-assets';New-Item -ItemType Directory -Force $tmp | Out-Null

          curl.exe -L --fail --retry 3 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -o "$tmp/vosk.zip"
          Expand-Archive "$tmp/vosk.zip" "$tmp/vosk" -Force
          New-Item -ItemType Directory -Force "$desktop/Models" | Out-Null
          Copy-Item "$tmp/vosk/vosk-model-small-en-us-0.15" "$desktop/Models/vosk-model-small-en-us-0.15" -Recurse -Force

          $wr=Invoke-RestMethod 'https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest'
          $wa=$wr.assets | Where-Object {$_.name -eq 'whisper-bin-x64.zip'} | Select-Object -First 1
          if(-not $wa){throw 'official whisper.cpp x64 asset not found'}
          curl.exe -L --fail --retry 3 $wa.browser_download_url -o "$tmp/whisper.zip"
          Expand-Archive "$tmp/whisper.zip" "$tmp/whisper" -Force
          $wexe=Get-ChildItem "$tmp/whisper" -Recurse -Filter 'whisper-cli.exe' | Select-Object -First 1
          if(-not $wexe){throw 'whisper-cli.exe missing from official asset'}
          New-Item -ItemType Directory -Force "$desktop/AI/whisper" | Out-Null
          Copy-Item "$($wexe.Directory.FullName)/*" "$desktop/AI/whisper" -Recurse -Force
          New-Item -ItemType Directory -Force "$desktop/Models/whisper" | Out-Null
          curl.exe -L --fail --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin?download=true' -o "$desktop/Models/whisper/ggml-tiny.en.bin"

          $lr=Invoke-RestMethod 'https://api.github.com/repos/ggml-org/llama.cpp/releases/latest'
          $la=$lr.assets | Where-Object {$_.name -match 'bin-win-cpu-x64\.zip$'} | Select-Object -First 1
          if(-not $la){$la=$lr.assets | Where-Object {$_.name -match 'win.*x64.*\.zip$' -and $_.name -notmatch 'cuda|vulkan|sycl|hip|arm'} | Select-Object -First 1}
          if(-not $la){throw 'official llama.cpp Windows x64 CPU asset not found'}
          curl.exe -L --fail --retry 3 $la.browser_download_url -o "$tmp/llama.zip"
          Expand-Archive "$tmp/llama.zip" "$tmp/llama" -Force
          $lexe=Get-ChildItem "$tmp/llama" -Recurse -Filter 'llama-cli.exe' | Select-Object -First 1
          if(-not $lexe){throw 'llama-cli.exe missing from official asset'}
          New-Item -ItemType Directory -Force "$desktop/AI/llama" | Out-Null
          Copy-Item "$($lexe.Directory.FullName)/*" "$desktop/AI/llama" -Recurse -Force
          New-Item -ItemType Directory -Force "$desktop/AI/models" | Out-Null
          curl.exe -L --fail --retry 3 'https://huggingface.co/unsloth/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf?download=true' -o "$desktop/AI/models/SmolLM2-360M-Instruct-Q4_K_M.gguf"
          $modelHash=(Get-FileHash "$desktop/AI/models/SmolLM2-360M-Instruct-Q4_K_M.gguf" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($modelHash -ne '16c7f1667fea34bacad196a57b548effcb37614db4ab5677a20c8c7b823b9e63'){throw "AI model hash mismatch: $modelHash"}
          Get-Item "$desktop/AI/llama/llama-cli.exe","$desktop/AI/whisper/whisper-cli.exe","$desktop/Models/whisper/ggml-tiny.en.bin","$desktop/AI/models/SmolLM2-360M-Instruct-Q4_K_M.gguf" | Select-Object FullName,Length | Out-Host

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.12.1'

      - name: Restore and build net48 application
        shell: pwsh
        run: |
          msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /t:Restore /p:RestorePackagesConfig=true /v:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          msbuild 'NEWAGE_WORSHIP/NewAgeWorship.sln' /m /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Compile functional acceptance harness
        shell: pwsh
        run: |
          $code=@'
          using System;
          using System.IO;
          using System.Linq;
          using System.Speech.AudioFormat;
          using System.Speech.Synthesis;
          using NewAgeWorship.Core.Services;
          using NewAgeWorship.Desktop;
          public static class FunctionalAcceptance
          {
              static void Need(bool ok,string message){if(!ok)throw new Exception(message);}
              [STAThread] public static void Main()
              {
                  var root=AppDomain.CurrentDomain.BaseDirectory;
                  var report=Path.Combine(root,"functional-test-report.txt");
                  File.WriteAllText(report,"NEWAGE WORSHIP functional acceptance\r\n");
                  var testData=Path.Combine(Path.GetTempPath(),"newage-functional-"+Guid.NewGuid().ToString("N"));Directory.CreateDirectory(testData);
                  using(var bible=new BibleLibrary(testData,Path.Combine(root,"Data","Bible_Versions.zip")))
                  {
                      Need(bible.Translations.Count==8,"Bible version count != 8");
                      var parser=new ScriptureReferenceParser(); ScriptureReference r; Need(parser.TryParse("John 3:16",out r),"Reference parser failed");
                      BiblePassage p; Need(bible.TryGetPassage(r,"KJV",out p),"KJV John 3:16 lookup failed"); Need(p.Text.IndexOf("God so loved",StringComparison.OrdinalIgnoreCase)>=0,"KJV passage text is not real Bible content");
                      Need(bible.Search("only begotten Son","KJV",5).Count>0,"Bible full-text search failed");
                      BiblePassage grouped; Need(bible.TryGetPassage(r,"MSG",out grouped),"Grouped passage lookup failed"); Need(grouped.Reference.EndsWith(":16-18"),"Grouped source range was not preserved");
                      File.AppendAllText(report,"PASS Bible: 8 versions, real KJV lookup/search, grouped ranges preserved\r\n");
                      ScriptureReference spoken;Need(parser.TryParseSpoken("john three sixteen",out spoken)&&spoken.Chapter==3&&spoken.VerseStart==16,"Spoken reference parser failed");
                  }
                  var silent=new byte[32000];Need(AudioHealthAnalyzer.AnalyzePcm16(silent,silent.Length,48000,"fixture").Status=="SILENT","Mixer silence detection failed");
                  var healthy=new byte[32000];for(int i=0;i<healthy.Length/2;i++){short s=(short)(10000*Math.Sin(2*Math.PI*440*i/48000.0));healthy[i*2]=(byte)(s&255);healthy[i*2+1]=(byte)((s>>8)&255);}Need(AudioHealthAnalyzer.AnalyzePcm16(healthy,healthy.Length,48000,"fixture").Status=="HEALTHY","Mixer healthy level detection failed");
                  var clip=new byte[32000];for(int i=0;i<clip.Length/2;i++){short s=32767;clip[i*2]=(byte)(s&255);clip[i*2+1]=(byte)((s>>8)&255);}Need(AudioHealthAnalyzer.AnalyzePcm16(clip,clip.Length,48000,"fixture").Status=="CLIPPING","Mixer clipping detection failed");
                  File.AppendAllText(report,"PASS Mixer analyzer: silence / healthy / clipping\r\n");
                  var ai=new LocalAiAssistant(root);Need(ai.IsReady,"Local AI runtime/model not ready");var answer=ai.CompleteAsync("Give one concise operator note: John 3:16 is prepared in Preview and still needs human approval.").GetAwaiter().GetResult();Need(!String.IsNullOrWhiteSpace(answer)&&answer.IndexOf("failed safely",StringComparison.OrdinalIgnoreCase)<0&&answer.IndexOf("timed out",StringComparison.OrdinalIgnoreCase)<0,"Local AI inference failed: "+answer);File.AppendAllText(report,"PASS Local AI inference: "+answer+"\r\n");
                  var wav=Path.Combine(root,"john-three-sixteen.wav");
                  using(var synth=new SpeechSynthesizer()){synth.SetOutputToWaveFile(wav,new SpeechAudioFormatInfo(16000,AudioBitsPerSample.Sixteen,AudioChannel.Mono));synth.Speak("John three sixteen");}
                  var vosk=new VoskSpeechService(Path.Combine(root,"Models","vosk-model-small-en-us-0.15"));Need(vosk.IsReady,"Vosk model missing");var vt=vosk.TranscribeWaveFile(wav);Need(!String.IsNullOrWhiteSpace(vt),"Vosk returned empty transcript");vosk.Dispose();
                  var whisper=new WhisperSpeechService(root);Need(whisper.IsReady,"Whisper runtime/model missing");var wt=whisper.TranscribeWaveFile(wav);Need(!String.IsNullOrWhiteSpace(wt),"Whisper returned empty transcript");
                  File.AppendAllText(report,"PASS Vosk transcript: "+vt+"\r\nPASS Whisper transcript: "+wt+"\r\n");
                  var sp=new ScriptureReferenceParser();ScriptureReference vr,wr;Need(sp.TryParseSpoken(vt,out vr)||sp.TryParseSpoken(wt,out wr),"Neither real ASR transcript resolved the spoken Bible reference");
                  File.AppendAllText(report,"PASS Voice -> scripture reference integration\r\nALL FUNCTIONAL GATES PASSED\r\n");
                  Console.WriteLine(File.ReadAllText(report));
              }
          }
          '@
          Set-Content FunctionalAcceptance.cs $code -Encoding UTF8
          $out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path
          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          $ref=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          & $csc /nologo /target:exe /out:"$out\FunctionalAcceptance.exe" /reference:"$out\NewAgeWorship.exe" /reference:"$out\NewAgeWorship.Core.dll" /reference:"$out\System.Data.SQLite.dll" /reference:"$out\NAudio.dll" /reference:"$out\Vosk.dll" /reference:"$ref\System.Speech.dll" /reference:"$ref\System.Web.Extensions.dll" FunctionalAcceptance.cs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Run functional acceptance gates
        shell: pwsh
        run: |
          $out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path
          Push-Location $out
          & .\FunctionalAcceptance.exe
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){exit $code}
          Copy-Item "$out/functional-test-report.txt" . -Force
          Copy-Item "$out/john-three-sixteen.wav" . -Force

      - name: Compile real WPF capture harness
        shell: pwsh
        run: |
          $code=@'
          using System;
          using System.IO;
          using System.Reflection;
          using System.Threading.Tasks;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;
          using System.Windows.Media.Imaging;
          using System.Windows.Threading;
          using NewAgeWorship.Desktop;
          public static class CaptureFunctional
          {
              [STAThread] public static void Main()
              {
                  Directory.CreateDirectory("functional-capture");var app=new Application();var w=new MainWindow();w.Width=1440;w.Height=900;w.Left=8;w.Top=8;w.Show();Pump(1500);Shot(w,"functional-capture/01-ready.png");
                  var command=(TextBox)w.FindName("CommandBox");command.Text="John 3:16";Invoke(w,"LookupBible_Click");Pump(500);Shot(w,"functional-capture/02-bible-lookup.png");
                  Invoke(w,"ParseScripture_Click");Pump(700);Shot(w,"functional-capture/03-bible-preview.png");
                  var prompt=(TextBox)w.FindName("AiPromptBox");prompt.Text="Give one concise operator note: John 3:16 is prepared in Preview and still needs human approval.";Invoke(w,"AiAssist_Click");PumpUntil(()=>((Button)w.FindName("AiAssistButton")).IsEnabled,30000);Shot(w,"functional-capture/04-local-ai.png");
                  var m=typeof(MainWindow).GetMethod("ProcessAudioFileAsync",BindingFlags.NonPublic|BindingFlags.Instance);var t=(Task)m.Invoke(w,new object[]{Path.Combine(AppDomain.CurrentDomain.BaseDirectory,"john-three-sixteen.wav")});PumpUntil(()=>t.IsCompleted,60000);if(t.IsFaulted)throw t.Exception;var scroll=(ScrollViewer)w.FindName("AssistScroll");scroll.ScrollToEnd();Pump(500);Shot(w,"functional-capture/05-audio-voice.png");
                  w.Close();app.Shutdown();
              }
              static void Invoke(MainWindow w,string name){var m=typeof(MainWindow).GetMethod(name,BindingFlags.NonPublic|BindingFlags.Instance);if(m==null)throw new Exception("missing "+name);m.Invoke(w,new object[]{w,new RoutedEventArgs()});}
              static void Pump(int ms){var f=new DispatcherFrame();var t=new DispatcherTimer(DispatcherPriority.Background){Interval=TimeSpan.FromMilliseconds(ms)};t.Tick+=(s,e)=>{t.Stop();f.Continue=false;};t.Start();Dispatcher.PushFrame(f);}
              static void PumpUntil(Func<bool> done,int timeout){var start=DateTime.UtcNow;while(!done()){if((DateTime.UtcNow-start).TotalMilliseconds>timeout)throw new TimeoutException("capture action timed out");Pump(120);}}
              static void Shot(Window w,string path){w.UpdateLayout();int width=(int)Math.Ceiling(w.ActualWidth),height=(int)Math.Ceiling(w.ActualHeight);var bmp=new RenderTargetBitmap(width,height,96,96,PixelFormats.Pbgra32);bmp.Render(w);var enc=new PngBitmapEncoder();enc.Frames.Add(BitmapFrame.Create(bmp));using(var fs=File.Create(path))enc.Save(fs);}
          }
          '@
          Set-Content CaptureFunctional.cs $code -Encoding UTF8
          $out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path
          Copy-Item 'john-three-sixteen.wav' "$out/john-three-sixteen.wav" -Force
          $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe";$ref=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          & $csc /nologo /target:exe /out:"$out\CaptureFunctional.exe" /reference:"$out\NewAgeWorship.exe" /reference:"$out\NewAgeWorship.Core.dll" /reference:"$ref\WindowsBase.dll" /reference:"$ref\PresentationCore.dll" /reference:"$ref\PresentationFramework.dll" /reference:"$ref\System.Xaml.dll" CaptureFunctional.cs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Capture actual functional WPF runtime
        shell: pwsh
        run: |
          $out=(Resolve-Path 'NEWAGE_WORSHIP/src/NewAgeWorship.Desktop/bin/Release/net48').Path
          Push-Location $out;& .\CaptureFunctional.exe;$code=$LASTEXITCODE;Pop-Location
          if($code -ne 0){exit $code}
          if(-not (Test-Path "$out/functional-capture/05-audio-voice.png")){throw 'functional capture incomplete'}
          New-Item -ItemType Directory -Force functional-capture | Out-Null
          Copy-Item "$out/functional-capture/*.png" functional-capture/ -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NewAgeWorship-Functional-Acceptance
          path: |
            functional-test-report.txt
            functional-capture/*.png
            john-three-sixteen.wav
          if-no-files-found: error
          retention-days: 7
