name: Dispatch NEWAGE functional loop 2
on:
  push:
    branches: [newage-worship-v1.0.0]
    paths: ['.github/workflows/dispatch-newage-functional-loop-2.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch acceptance workflow at current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run newage-functional-integration-loop.yml --repo Veektall/LightWorship --ref newage-worship-v1.0.0
