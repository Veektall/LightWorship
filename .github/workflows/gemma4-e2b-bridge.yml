name: Gemma 4 E2B Workspace Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: startsWith(github.event.issue.title, 'gemma4-e2b-build:') && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare downloader
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade huggingface_hub hf_xet
          mkdir -p payload/model payload/meta

      - name: Download and verify official E2B LiteRT-LM package
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              repo_id='litert-community/gemma-4-E2B-it-litert-lm',
              filename='gemma-4-E2B-it.litertlm',
              local_dir='payload/model',
          ))
          PY
          echo '181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c  payload/model/gemma-4-E2B-it.litertlm' | sha256sum -c -
          stat -c '%n %s bytes' payload/model/gemma-4-E2B-it.litertlm

      - name: Split and manifest
        run: |
          set -euo pipefail
          cd payload/model
          split -b 450M -d -a 2 gemma-4-E2B-it.litertlm gemma4-e2b.part-
          sha256sum gemma4-e2b.part-* > ../meta/PARTS.SHA256
          stat -c '%n %s' gemma4-e2b.part-* > ../meta/PARTS.SIZES
          cd ../..
          printf '%s\n' \
            'model=litert-community/gemma-4-E2B-it-litert-lm' \
            'file=gemma-4-E2B-it.litertlm' \
            'sha256=181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c' \
            'runtime=litert-lm==0.15.0 litert-lm-api==0.15.0' \
            'chunk_size=450M' > payload/meta/BUILD.txt
          cat payload/meta/PARTS.SIZES

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-meta
          path: payload/meta
          retention-days: 1
          compression-level: 0
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-00
          path: payload/model/gemma4-e2b.part-00
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-01
          path: payload/model/gemma4-e2b.part-01
          retention-days: 1
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-02
          path: payload/model/gemma4-e2b.part-02
          retention-days: 1
          compression-level: 0
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-03
          path: payload/model/gemma4-e2b.part-03
          retention-days: 1
          compression-level: 0
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-04
          path: payload/model/gemma4-e2b.part-04
          retention-days: 1
          compression-level: 0
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-part-05
          path: payload/model/gemma4-e2b.part-05
          retention-days: 1
          compression-level: 0
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="GEMMA4_E2B_BRIDGE_READY run_id=${GITHUB_RUN_ID} sha256=181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="GEMMA4_E2B_BRIDGE_FAILED run_id=${GITHUB_RUN_ID}"
