name: Report NOCTURNE Pages result

on:
  workflow_run:
    workflows: ["Deploy NOCTURNE to GitHub Pages"]
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified deployment report
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = context.payload.workflow_run.conclusion;
            const ok = conclusion === 'success';
            const url = 'https://veektall.github.io/LightWorship/';
            const title = ok ? 'nocturne-pages: deployment verified' : 'nocturne-pages: deployment failed';
            const body = [
              `Conclusion: ${conclusion}`,
              `Workflow run: ${context.payload.workflow_run.html_url}`,
              `Public URL: ${url}`,
              ok ? 'The deployment workflow reconstructed the checksummed archive, validated app.js and the required content, deployed the Pages artifact, and fetched the public page successfully.' : 'The Pages workflow did not complete successfully; inspect the linked run.'
            ].join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
