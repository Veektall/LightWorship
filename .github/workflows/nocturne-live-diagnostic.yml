name: NOCTURNE live diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: startsWith(github.event.issue.title, 'nocturne-diagnostic:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose live page
        env:
          SITE_URL: https://htmlpreview.github.io/?https://github.com/Veektall/LightWorship/blob/5a9f2c4c15f7e71628e297aa51f8898d563b307f/site/index.html
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.2
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          cat > diagnose.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl'] });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const consoleMessages = [];
          const failedRequests = [];
          const responses = [];
          page.on('console', m => consoleMessages.push({ type: m.type(), text: m.text() }));
          page.on('pageerror', e => consoleMessages.push({ type: 'pageerror', text: e.message }));
          page.on('requestfailed', r => failedRequests.push({ url: r.url(), error: r.failure()?.errorText }));
          page.on('response', r => {
            if (/index\.html|styles\.css|app\.js|three\.module|fonts\.googleapis|fonts\.gstatic|htmlpreview/.test(r.url())) responses.push({ url: r.url(), status: r.status(), contentType: r.headers()['content-type'] });
          });
          const response = await page.goto(process.env.SITE_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForTimeout(7000);
          const state = await page.evaluate(() => {
            const hero = document.querySelector('#hero-title');
            const preloader = document.querySelector('#preloader');
            const appScript = document.querySelector('script[src*="app.js"]');
            const style = hero ? getComputedStyle(hero) : null;
            return {
              documentTitle: document.title,
              readyState: document.readyState,
              bodyClasses: document.body.className,
              heroExists: Boolean(hero),
              heroText: hero?.textContent?.trim(),
              heroStyle: style ? { display: style.display, visibility: style.visibility, opacity: style.opacity } : null,
              preloaderClasses: preloader?.className,
              appScript: appScript?.src,
              stylesheets: [...document.styleSheets].map(s => s.href),
              webglStatus: document.querySelector('#webglStatus')?.textContent,
              loadProgress: document.querySelector('#loadProgress')?.style.width
            };
          });
          console.log(JSON.stringify({ mainStatus: response?.status(), finalUrl: page.url(), state, responses, failedRequests, consoleMessages }, null, 2));
          await page.screenshot({ path: '/tmp/nocturne-diagnostic.png', fullPage: false });
          await browser.close();
          JS
          node ./diagnose.mjs > /tmp/diagnostic.log 2>&1
          cat /tmp/diagnostic.log

      - name: Report diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          printf 'NOCTURNE live diagnostic. Workflow run: %s/%s/actions/runs/%s\n\n```json\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/diagnostic-comment.md
          tail -c 12000 /tmp/diagnostic.log >> /tmp/diagnostic-comment.md || true
          printf '\n```\n' >> /tmp/diagnostic-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostic-comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
