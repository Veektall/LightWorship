name: Stage Video for Gemini

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  stage-video:
    if: startsWith(github.event.issue.title, 'stage-video:') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['ISSUE_BODY'])
          url = str(data.get('url','')).strip()
          filename = str(data.get('filename','')).strip()
          if not url.startswith(('https://','http://')):
              raise SystemExit('Valid URL required')
          if not filename or '/' in filename or '\\' in filename:
              raise SystemExit('Safe filename required')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'url={url}\n')
              fh.write(f'filename={filename}\n')
          PY

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --upgrade "yt-dlp[default]"

      - name: Download and stage video
        env:
          VIDEO_URL: ${{ steps.request.outputs.url }}
          FILENAME: ${{ steps.request.outputs.filename }}
        run: |
          set -euo pipefail
          OUT=".gemini-bridge/jobs/${FILENAME}"
          mkdir -p .gemini-bridge/jobs
          rm -f "$OUT"
          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            --remux-video mp4 \
            --format "bv*[height<=720]+ba/b[height<=720]/best" \
            --output "$OUT" \
            --retries 5 \
            --fragment-retries 5 \
            --socket-timeout 30 \
            "$VIDEO_URL"
          test -s "$OUT"

      - name: Commit staged video
        env:
          FILENAME: ${{ steps.request.outputs.filename }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".gemini-bridge/jobs/${FILENAME}"
          git commit -m "Stage video for Gemini: ${FILENAME}"
          git push

      - name: Report success
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Video staged successfully.\nRaw URL: https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/.gemini-bridge/jobs/${{ steps.request.outputs.filename }}\nRun ID: ${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});
